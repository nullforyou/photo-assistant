org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# 禁用系统代理，让 Gradle 直连（本机 Clash 代理 7897 对 Maven 仓库超时，直连正常）
systemProp.java.net.useSystemProxies=false
systemProp.http.nonProxyHosts=localhost|127.0.0.1|*
systemProp.https.nonProxyHosts=localhost|127.0.0.1|*
# 禁用 Gradle daemon，避免残留 daemon 带着旧代理配置被复用导致构建卡死/误报失败
org.gradle.daemon=false
org.gradle.parallel=false
# 关闭 Kotlin 增量编译，避免火绒实时扫描锁住增量缓存 .tab 文件导致 "Could not close incremental caches"
kotlin.incremental=false
